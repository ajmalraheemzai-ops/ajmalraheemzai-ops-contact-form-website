<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Ajmal Abdulrahimzai</title>
<meta name="description" content="Get in touch with Ajmal Abdulrahimzai for web development, design and video projects.">
<style>
:root{--bg:#e9eef4;--ink:#0f1b2d;--muted:#4b5b72;--accent:#2547f5;--accent-dark:#1a35c4;--line:#b9c4d4;--error:#c62839;--ok:#1e7a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
.page{max-width:1080px;margin:0 auto;padding:48px 20px 64px;display:grid;gap:40px;grid-template-columns:1fr}
@media(min-width:860px){.page{grid-template-columns:1fr 1fr;gap:72px;padding-top:96px;align-items:start}}
.name{margin:0 0 16px;font-weight:600;color:var(--accent)}
h1{margin:0 0 20px;font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.02;letter-spacing:-.03em;font-weight:800}
.lead{margin:0;max-width:36ch;font-size:1.1rem;color:var(--muted)}
form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:18px}
.row{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:520px){.row{grid-template-columns:1fr 1fr}}
.field{display:grid;gap:6px}
label{font-weight:600;font-size:.95rem}
input,textarea{width:100%;font:inherit;color:var(--ink);background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
textarea{resize:vertical;min-height:140px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--error)}
button{font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:14px 20px;cursor:pointer}
button:hover{background:var(--accent-dark)}
button:disabled{opacity:.6;cursor:wait}
#status{margin:0;min-height:1.5em;font-weight:600}
#status.error{color:var(--error)}
#status.ok{color:var(--ok)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<main class="page">
  <section>
    <p class="name">Ajmal Abdulrahimzai</p>
    <h1>Tell me what you need built.</h1>
    <p class="lead">Websites, design and video editing. Describe your project and I will reply by email.</p>
  </section>

  <form id="contact-form" novalidate>
    <div class="row">
      <div class="field"><label for="firstName">First name</label>
        <input id="firstName" name="firstName" type="text" autocomplete="given-name" maxlength="60" required></div>
      <div class="field"><label for="lastName">Last name</label>
        <input id="lastName" name="lastName" type="text" autocomplete="family-name" maxlength="60" required></div>
    </div>
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="120" required></div>
    <div class="field"><label for="message">Message</label>
      <textarea id="message" name="message" rows="6" minlength="10" maxlength="3000" required></textarea></div>

    <!-- Spam trap: hidden from people -->
    <div class="hp" aria-hidden="true"><label for="_honey">Leave empty</label>
      <input id="_honey" name="_honey" type="text" tabindex="-1" autocomplete="off"></div>

    <button type="submit" id="submit-btn">Send message</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
// Messages are delivered to this address through FormSubmit.co (no server needed)
const TO_EMAIL = "Ajmal.abdulrahimzai123@gmail.com";

const form = document.getElementById("contact-form");
const btn = document.getElementById("submit-btn");
const statusEl = document.getElementById("status");
const setStatus = (t, c) => { statusEl.textContent = t; statusEl.className = c || ""; };

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  setStatus("", "");
  const names = ["firstName", "lastName", "email", "message"];
  names.forEach(n => form.elements[n].removeAttribute("aria-invalid"));
  const bad = names.find(n => !form.elements[n].checkValidity() || !form.elements[n].value.trim());
  if (bad) {
    form.elements[bad].setAttribute("aria-invalid", "true");
    form.elements[bad].focus();
    setStatus("Check the highlighted field and try again.", "error");
    return;
  }
  const f = form.elements;
  const payload = {
    firstName: f.firstName.value.trim(),
    lastName: f.lastName.value.trim(),
    email: f.email.value.trim(),
    message: f.message.value.trim(),
    _honey: f._honey.value,
    _subject: "New message from " + f.firstName.value.trim() + " " + f.lastName.value.trim(),
    _template: "table",
    _captcha: "false"
  };
  btn.disabled = true; btn.textContent = "Sending...";
  try {
    const res = await fetch("https://formsubmit.co/ajax/" + TO_EMAIL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!res.ok || String(json.success) !== "true") throw new Error(json.message || "failed");
    form.reset();
    setStatus("Message sent. I will reply to your email soon.", "ok");
  } catch (e) {
    setStatus("Could not send your message. Please try again later.", "error");
  } finally {
    btn.disabled = false; btn.textContent = "Send message";
  }
});
</script>
</body>
</html>
